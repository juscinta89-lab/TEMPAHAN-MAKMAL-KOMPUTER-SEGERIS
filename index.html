<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Makmal Komputer SK Kuala Geris</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f4f6f9;
  margin: 0;
}

header {
  background: #1e88e5;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.slot {
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
}

.available {
  background: #c8e6c9;
}

.booked {
  background: #ffcdd2;
}

#user {
  margin: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h2>Tempahan Makmal Komputer</h2>
</header>

<div id="loginDiv"></div>
<div id="user"></div>

<div class="container">
  <input type="date" id="tarikh">
  <div class="grid" id="jadual"></div>
</div>

<script>

const SCRIPT_URL = "PASTE_URL_APPS_SCRIPT";
let userEmail = "";

// ================= LOGIN GOOGLE =================
window.onload = function () {
  google.accounts.id.initialize({
    client_id: "PASTE_CLIENT_ID_GOOGLE",
    callback: handleCredentialResponse
  });

  google.accounts.id.renderButton(
    document.getElementById("loginDiv"),
    { theme: "outline", size: "large" }
  );
};

function handleCredentialResponse(response) {
  const data = parseJwt(response.credential);
  userEmail = data.email;

  document.getElementById("user").innerText = "Login sebagai: " + userEmail;
}

function parseJwt(token) {
  return JSON.parse(atob(token.split('.')[1]));
}

// ================= SLOT =================
function janaSlot() {
  let start = 7 * 60 + 45;
  let end = 12 * 60 + 25;

  const rehat = [9*60+45, 10*60+15];
  const jadual = document.getElementById("jadual");
  jadual.innerHTML = "";

  for (let t = start; t < end; t += 30) {
    if (rehat.includes(t)) continue;

    let h = Math.floor(t / 60);
    let m = t % 60;
    let masa = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

    let div = document.createElement("div");
    div.className = "slot available";
    div.innerText = masa;

    div.onclick = () => tempah(masa, div);

    jadual.appendChild(div);
  }
}

// ================= TEMPAHAN =================
function tempah(masa, el) {
  if (!userEmail) {
    alert("Sila login dulu!");
    return;
  }

  const tarikh = document.getElementById("tarikh").value;

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      email: userEmail,
      tarikh: tarikh,
      masa: masa,
      kelas: "Kelas"
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === "success") {
      el.classList.remove("available");
      el.classList.add("booked");
    } else {
      alert(res.message);
    }
  });
}

janaSlot();

</script>

</body>
</html>
